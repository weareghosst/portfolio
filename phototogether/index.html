<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoTogether - Juntar Fotos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-brand">
      <a class="top-link" href="https://weareghost.sbs" target="_blank" rel="noreferrer">weareghost.sbs</a>
      <img class="top-logo" src="./public/WEAREGHOST.png" alt="Logo WeAreGhost" />
    </div>

    <div class="app-shell">
      <header>
        <h1>Juntar Fotos</h1>
        <p>Exportação limpa das duas imagens lado a lado, pronta para impressão.</p>
      </header>

      <section class="controls">
        <label class="file-button">ADICIONE A 1 FOTO
          <input id="photo1" type="file" accept="image/*" />
        </label>
        <label class="file-button">ADICIONE A 2 FOTO
          <input id="photo2" type="file" accept="image/*" />
        </label>
        <button id="duplicateBtn" type="button" class="action-button">Duplicar Foto</button>
        <button id="clearBtn" type="button" class="action-button secondary">Excluir Fotos</button>
        <button id="generateBtn" type="button" class="action-button">Gerar Visualização</button>
        <button id="downloadBtn" type="button" class="action-button secondary" disabled>Baixar em PDF</button>
      </section>

      <section class="preview-card">
        <div class="preview">
          <div class="photo-box">
            <span>Foto 1</span>
            <img id="preview1" alt="Prévia foto 1" />
          </div>
          <div class="photo-box">
            <span>Foto 2</span>
            <img id="preview2" alt="Prévia foto 2" />
          </div>
        </div>
        <div class="output-area">
          <h2>Visualização</h2>
          <canvas id="outputCanvas" width="2400" height="1600"></canvas>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
